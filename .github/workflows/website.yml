name: Website

# Publishes mergelio.com to GitHub Pages. The page links straight to the files
# of the latest senseyman/mergelio release, so it is rebuilt daily, and right
# away when a release sends a `mergelio-release` repository_dispatch.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  schedule:
    - cron: '17 6 * * *'
  repository_dispatch:
    types: [mergelio-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render with the latest app release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: senseyman/mergelio
        run: ./website/build.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
